name: Build and publish APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK assets
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "kgs-${{ github.event.release.tag_name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk kgs-latest.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kgs-${{ github.event.release.tag_name }}.apk
            kgs-latest.apk
